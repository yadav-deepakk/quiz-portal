spring.application.name=api

#datasource config (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examportal}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#jpa config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring security - jwt config
jwt.token.encryption_key=6663695447654a717243467459337272596769584f4b49504e59666f48446b77
jwt.token.validity_millisec=18000000
